name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # 归档测试需要 7-Zip 的 7zz 命令
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends 7zip
      - run: uv sync --frozen
      - run: uv run pytest
